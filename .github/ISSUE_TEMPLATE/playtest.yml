name: Bug report
description: Report a crash, rendering problem, audio issue or persistent stutter.
body:
  - type: textarea
    id: issue
    attributes:
      label: What happened and how can we reproduce it?
      description: Include location, last working save, action, expected result, and whether it repeats.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Windows version, CPU, GPU and driver
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Preview version, visual preset, window size, input device
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional screenshot or relevant log excerpt
      description: F8 captures are in .local/runtime/captures; game logs are in .local/runtime. Review excerpts for personal paths. Do not upload game files, saves, full caches or memory dumps.
