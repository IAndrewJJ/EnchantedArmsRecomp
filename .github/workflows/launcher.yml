name: Launcher kit
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ISO/setup helpers with synthetic fixtures
        run: |
          python tools/test_setup.py -v
          python tools/test_release.py -v
      - name: Install and verify all pinned tools in a fresh folder
        run: python tools/check_toolchain.py --directory "${{ runner.temp }}/Full toolchain fresh install"
      - name: Compile launcher
        shell: powershell
        run: ./scripts/build-launcher.ps1
      - name: Check settings, lifecycle, buffered logs and release metadata
        shell: powershell
        run: |
          $process = Start-Process ./EnchantedArmsLauncher.exe --self-test -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Launcher self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-only-build-check
          path: EnchantedArmsLauncher.exe
          if-no-files-found: error
          retention-days: 14
